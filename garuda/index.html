<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Garuda Bells Prototype</title>
<style>
  body { margin:0; background:#15161a; color:#ddd; font-family: system-ui, sans-serif; display:flex; gap:16px; padding:16px; }
  canvas { background:#1f2026; border-radius:8px; cursor:pointer; }
  #side { width:340px; font-size:13px; }
  h3 { margin:8px 0 6px; font-size:14px; color:#fff; }
  .row { display:flex; align-items:center; gap:6px; margin:3px 0; }
  .row label { width:150px; }
  .row input[type=range] { flex:1; }
  .row span { width:44px; text-align:right; font-variant-numeric: tabular-nums; }
  button { background:#2d2f38; color:#ddd; border:1px solid #444; border-radius:4px; padding:5px 8px; cursor:pointer; margin:2px 2px 2px 0; }
  button:hover { background:#3a3d48; }
  #log { height:190px; overflow:auto; background:#101114; border-radius:6px; padding:6px; font-family: monospace; font-size:11px; line-height:1.4; }
  .dmg { color:#ff8a7a; } .time { color:#8fd3ff; } .ok { color:#9be59b; } .fail { color:#ffb84d; }
  .help { color:#999; line-height:1.5; }
</style>
</head>
<body>
<canvas id="c" width="760" height="760"></canvas>
<div id="side">
  <h3>Controls</h3>
  <div class="help">
    Click a bell (or press 1 / 2 / 3) to strike it.<br>
    Drag Garuda anywhere. Click the center button to snap him there.<br>
    H = stick hit on Garuda (only when not dazed).<br>
    Hold F = feed leaf (only while dazed).<br>
    D = force daze (for testing).
  </div>
  <div>
    <button id="center">Garuda to center</button>
    <button id="wander">Wander: OFF</button>
    <button id="reset">Reset fight</button>
  </div>

  <h3>Bell / pulse tuning</h3>
  <div id="sliders"></div>

  <h3>Hit log</h3>
  <div id="log"></div>
</div>

<script>
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const W = cv.width, H = cv.height, CX = W/2, CY = H/2 + 30;
const ARENA_R = 320;

const P = {
  pulses:     { v:11,  min:1,   max:20,  step:1,    label:'Pulses per strike' },
  interval:   { v:1.15,min:0.1, max:4, step:0.05, label:'Gap between pulses (s)' },
  speed:      { v:170, min:100, max:1000,step:10,   label:'Halo expand speed (px/s)' },
  bellDist:   { v:275, min:80,  max:300, step:5,    label:'Bell distance from center' },
  R0:         { v:475, min:100, max:700, step:5,    label:'Pulse 1 max reach (px)' },
  rDecay:     { v:0.90,min:0.5, max:1,   step:0.01, label:'Reach kept per pulse' },
  S0:         { v:10,  min:1,   max:40,  step:0.5,  label:'Pulse 1 strength' },
  sDecay:     { v:0.72,min:0.4, max:1,   step:0.01, label:'Strength kept per pulse' },
  edgeMin:    { v:0.25,min:0,   max:1,   step:0.05, label:'Strength at edge of reach' },
  timeGain:   { v:0.39,min:0,   max:1,   step:0.01, label:'Timer secs per strength' },
  baseTimer:  { v:2.5, min:0.5, max:10,  step:0.1,  label:'Base feeding timer (s)' },
  feedRate:   { v:18,  min:5,   max:100, step:1,    label:'Feed fill rate (%/s)' },
  segments:   { v:1,   min:1,   max:8,   step:1,    label:'Curse segments' },
  segSize:    { v:90,  min:20,  max:300, step:10,   label:'Curse per segment' },
  stickDmg:   { v:8,   min:0,   max:50,  step:1,    label:'Stick hit damage' },
};
const sl = document.getElementById('sliders');
for (const k in P) {
  const p = P[k];
  const row = document.createElement('div'); row.className='row';
  row.innerHTML = `<label>${p.label}</label><input type="range" min="${p.min}" max="${p.max}" step="${p.step}" value="${p.v}"><span>${p.v}</span>`;
  const inp = row.querySelector('input'), sp = row.querySelector('span');
  inp.oninput = () => { p.v = parseFloat(inp.value); sp.textContent = p.v; if (k==='segments'||k==='segSize') resetFight(); };
  sl.appendChild(row);
}
const v = k => P[k].v;

// ---------- state ----------
let bells = [], garuda, curse, segTop, dazed, feed, timer, timerPeak, purified, wander=false, feeding=false;
let floaters = [];
function bellPos(i){ const a = -Math.PI/2 + i*2*Math.PI/3; return {x:CX+Math.cos(a)*v('bellDist'), y:CY+Math.sin(a)*v('bellDist')}; }
function resetFight(){
  bells = [0,1,2].map(i => ({ i, ring:null }));
  garuda = { x:CX, y:CY-40, r:18, tx:CX, ty:CY, drag:false };
  curse = v('segments')*v('segSize'); segTop = curse;
  dazed=false; feed=0; timer=0; timerPeak=0; purified=false; floaters=[];
  log('Fight reset. Curse '+curse.toFixed(0), 'ok');
}

// A strike creates a ring: 11 pulses emitted at fixed gaps. Re-striking a ringing bell restarts it at pulse 1.
function strike(i){
  const now = performance.now()/1000;
  const pulses = [];
  for (let k=0;k<v('pulses');k++){
    pulses.push({ k, te: now + k*v('interval'),
      R: v('R0')*Math.pow(v('rDecay'),k),
      S: v('S0')*Math.pow(v('sDecay'),k),
      hit:false, dead:false });
  }
  bells[i].ring = { pulses };
}

function pulseValue(p, d){ // distance falloff inside one pulse
  const t = Math.min(1, d / p.R);
  return p.S * (1 - (1 - v('edgeMin')) * t);
}

function applyPulse(bellIdx, p, d){
  if (purified) return;
  const val = pulseValue(p, d);
  if (dazed){
    const add = val * v('timeGain');
    timer += add; timerPeak = Math.max(timerPeak, timer);
    floaters.push({ x:garuda.x, y:garuda.y-30, txt:'+'+add.toFixed(2)+'s', col:'#8fd3ff', t:1 });
    log(`Bell ${bellIdx+1} pulse ${p.k+1}  d=${d.toFixed(0)}  str=${val.toFixed(2)}  TIMER +${add.toFixed(2)}s`, 'time');
  } else {
    damage(val, `Bell ${bellIdx+1} pulse ${p.k+1}  d=${d.toFixed(0)}  str=${val.toFixed(2)}  CURSE -${val.toFixed(2)}`);
  }
}

function damage(amount, msg){
  if (dazed || purified) return;
  curse -= amount;
  floaters.push({ x:garuda.x, y:garuda.y-30, txt:'-'+amount.toFixed(1), col:'#ff8a7a', t:1 });
  log(msg, 'dmg');
  const floor = segTop - v('segSize');
  if (curse <= floor + 1e-6){ curse = floor; startDaze(); }
}

function startDaze(){
  dazed=true; feed=0; timer=v('baseTimer'); timerPeak=timer;
  log('DAZED. Feeding timer '+timer.toFixed(1)+'s', 'ok');
}
function endDaze(success){
  dazed=false;
  if (success){
    segTop -= v('segSize');
    log('FEED SUCCESS. Segment gone for good.', 'ok');
    if (segTop <= 0){ purified=true; log('GARUDA PURIFIED', 'ok'); }
  } else {
    curse = segTop;
    log('FEED FAILED. Garuda regains the segment.', 'fail');
  }
}

// ---------- input ----------
function mpos(e){ const b=cv.getBoundingClientRect(); return {x:e.clientX-b.left, y:e.clientY-b.top}; }
cv.onmousedown = e => {
  const m = mpos(e);
  if (Math.hypot(m.x-garuda.x, m.y-garuda.y) < garuda.r+6){ garuda.drag=true; return; }
  for (let i=0;i<3;i++){ const b=bellPos(i); if (Math.hypot(m.x-b.x,m.y-b.y) < 26){ strike(i); return; } }
};
cv.onmousemove = e => { if (garuda.drag){ const m=mpos(e); garuda.x=m.x; garuda.y=m.y; } };
window.onmouseup = () => garuda.drag=false;
window.onkeydown = e => {
  if (e.key==='1'||e.key==='2'||e.key==='3') strike(parseInt(e.key)-1);
  if (e.key==='h'||e.key==='H') damage(v('stickDmg'), 'Stick hit  CURSE -'+v('stickDmg'));
  if (e.key==='f'||e.key==='F') feeding=true;
  if ((e.key==='d'||e.key==='D') && !dazed && !purified){ curse = segTop - v('segSize'); startDaze(); }
};
window.onkeyup = e => { if (e.key==='f'||e.key==='F') feeding=false; };
document.getElementById('center').onclick = () => { garuda.x=CX; garuda.y=CY; };
document.getElementById('reset').onclick = resetFight;
const wb = document.getElementById('wander');
wb.onclick = () => { wander=!wander; wb.textContent='Wander: '+(wander?'ON':'OFF'); };

const logEl = document.getElementById('log');
function log(msg, cls){ const d=document.createElement('div'); d.className=cls||''; d.textContent=msg; logEl.prepend(d); while(logEl.children.length>200) logEl.lastChild.remove(); }

// ---------- loop ----------
let last = performance.now()/1000;
function tick(){
  const now = performance.now()/1000, dt = Math.min(0.05, now-last); last=now;

  // Garuda movement (dazed Garuda stays where he fell)
  if (wander && !dazed && !garuda.drag && !purified){
    if (Math.hypot(garuda.tx-garuda.x, garuda.ty-garuda.y) < 8){
      const a=Math.random()*Math.PI*2, r=Math.random()*(ARENA_R-30);
      garuda.tx=CX+Math.cos(a)*r; garuda.ty=CY+Math.sin(a)*r;
    }
    const a=Math.atan2(garuda.ty-garuda.y, garuda.tx-garuda.x);
    garuda.x+=Math.cos(a)*90*dt; garuda.y+=Math.sin(a)*90*dt;
  }

  // Pulses: each pulse is an expanding wavefront that hits Garuda once as it passes him, if he is within its reach
  for (const b of bells){
    if (!b.ring) continue;
    const bp = bellPos(b.i);
    const d = Math.hypot(garuda.x-bp.x, garuda.y-bp.y);
    let alive=false;
    for (const p of b.ring.pulses){
      if (p.dead) continue;
      const age = now - p.te; if (age < 0){ alive=true; continue; }
      const r = age * v('speed');
      if (!p.hit && r >= d - garuda.r && d - garuda.r <= p.R){ p.hit=true; applyPulse(b.i, p, Math.max(0,d)); }
      if (r >= p.R) p.dead=true; else alive=true;
    }
    if (!alive) b.ring=null;
  }

  // Feeding
  if (dazed){
    timer -= dt;
    if (feeding) feed = Math.min(100, feed + v('feedRate')*dt);
    if (feed >= 100) endDaze(true);
    else if (timer <= 0){ timer=0; endDaze(false); }
  }

  floaters.forEach(f => { f.t -= dt; f.y -= 30*dt; });
  floaters = floaters.filter(f => f.t > 0);

  draw(now);
  requestAnimationFrame(tick);
}

function draw(now){
  ctx.clearRect(0,0,W,H);
  // arena
  ctx.fillStyle='#2a2c34'; ctx.beginPath(); ctx.arc(CX,CY,ARENA_R,0,Math.PI*2); ctx.fill();
  ctx.strokeStyle='#3c3f4a'; ctx.setLineDash([4,6]); ctx.beginPath(); ctx.arc(CX,CY,6,0,Math.PI*2); ctx.stroke(); ctx.setLineDash([]);

  // pulse 1 max reach guides
  for (let i=0;i<3;i++){ const b=bellPos(i);
    ctx.strokeStyle='rgba(255,255,255,0.06)'; ctx.beginPath(); ctx.arc(b.x,b.y,v('R0'),0,Math.PI*2); ctx.stroke(); }

  // halos
  for (const b of bells){
    if (!b.ring) continue; const bp=bellPos(b.i);
    for (const p of b.ring.pulses){
      if (p.dead) continue; const age=now-p.te; if (age<0) continue;
      const r=age*v('speed'); if (r>p.R) continue;
      const strengthFrac = p.S / v('S0');
      const distFrac = 1 - (1 - v('edgeMin')) * (r/p.R);
      ctx.strokeStyle=`rgba(255,215,90,${0.15+0.8*strengthFrac*distFrac})`;
      ctx.lineWidth = 1 + 4*strengthFrac*distFrac;
      ctx.beginPath(); ctx.arc(bp.x,bp.y,r,0,Math.PI*2); ctx.stroke();
    }
  }
  ctx.lineWidth=1;

  // bells
  for (let i=0;i<3;i++){ const b=bellPos(i);
    ctx.fillStyle = bells[i].ring ? '#ffd75a' : '#b8954a';
    ctx.beginPath(); ctx.arc(b.x,b.y,20,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#1f2026'; ctx.font='bold 14px system-ui'; ctx.textAlign='center'; ctx.fillText(i+1,b.x,b.y+5);
  }

  // garuda
  ctx.fillStyle = purified ? '#9be59b' : dazed ? '#8a8fa0' : '#e0574a';
  ctx.beginPath(); ctx.arc(garuda.x,garuda.y,garuda.r,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#fff'; ctx.font='11px system-ui'; ctx.textAlign='center';
  ctx.fillText(dazed?'DAZED':'GARUDA', garuda.x, garuda.y+garuda.r+14);

  floaters.forEach(f => { ctx.globalAlpha=Math.max(0,f.t); ctx.fillStyle=f.col; ctx.font='bold 13px system-ui'; ctx.fillText(f.txt,f.x,f.y); });
  ctx.globalAlpha=1;

  // HUD: curse meter
  const segs=v('segments'), ss=v('segSize'), bw=520, bx=(W-bw)/2, by=18, bh=16;
  ctx.textAlign='left'; ctx.fillStyle='#ccc'; ctx.font='12px system-ui'; ctx.fillText('Curse', bx-48, by+12);
  ctx.fillStyle='#101114'; ctx.fillRect(bx,by,bw,bh);
  ctx.fillStyle='#7a3fbf'; ctx.fillRect(bx,by,bw*Math.max(0,curse)/(segs*ss),bh);
  ctx.fillStyle='rgba(255,255,255,0.12)'; ctx.fillRect(bx + bw*(segTop - ss)/(segs*ss), by, bw*ss/(segs*ss), bh);
  ctx.strokeStyle='#15161a'; ctx.lineWidth=2;
  for (let s=1;s<segs;s++){ const x=bx+bw*s/segs; ctx.beginPath(); ctx.moveTo(x,by); ctx.lineTo(x,by+bh); ctx.stroke(); }
  ctx.lineWidth=1;

  if (dazed){
    // feeding meter
    const fy=by+26;
    ctx.fillStyle='#ccc'; ctx.fillText('Feed', bx-48, fy+12);
    ctx.fillStyle='#101114'; ctx.fillRect(bx,fy,bw,bh);
    ctx.fillStyle='#5fbf6a'; ctx.fillRect(bx,fy,bw*feed/100,bh);
    // timer
    const ty=fy+26, scale=Math.max(timerPeak, v('baseTimer'), 0.01);
    ctx.fillStyle='#ccc'; ctx.fillText('Timer', bx-48, ty+12);
    ctx.fillStyle='#101114'; ctx.fillRect(bx,ty,bw,bh);
    ctx.fillStyle='#4aa3df'; ctx.fillRect(bx,ty,bw*timer/scale,bh);
    ctx.fillStyle='#fff'; ctx.fillText(timer.toFixed(2)+'s', bx+bw+8, ty+12);
    const need = (100-feed)/v('feedRate');
    ctx.fillStyle = need <= timer ? '#9be59b' : '#ffb84d';
    ctx.fillText('needs '+need.toFixed(2)+'s of feeding', bx+bw+8, fy+12);
  }
}

resetFight();
requestAnimationFrame(tick);
</script>
</body>
</html>
